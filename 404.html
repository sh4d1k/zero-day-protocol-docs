<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Node Not Found — Zero Day Protocol | MTX Games</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <meta name="theme-color" content="#07090e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --card-bg: rgba(13, 17, 28, 0.85);
      --card-border: rgba(0, 243, 255, 0.25);
      --cyan: #00f3ff;
      --red: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--red);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--red);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }
    h2 {
      font-size: 1.3rem;
      color: var(--cyan);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cyan);
      color: #000;
      font-weight: 800;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn:hover {
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SIGNAL LOST // ERROR 404</div>
    <h1>404</h1>
    <h2>TARGET NODE UNREACHABLE</h2>
    <p>
      The network sector or data conduit you requested cannot be located. It may have been purged, relocated, or encrypted behind ICE firewalls.
    </p>
    <a href="/" class="btn">&larr; RETURN TO ACCESS POINT</a>
  </div>
</body>
</html>
