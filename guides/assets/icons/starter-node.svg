<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <!-- Zero-Day Protocol: Starter Node (Facing Up) Placeholder -->
  <!-- Replaceable asset: Drop new SVG from UI/UX here -->
  <defs>
    <filter id="starter-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(6, 6)" filter="url(#starter-glow)">
    <!-- Upright Workstation / Monitor Base -->
    <g transform="translate(12, 12) scale(0.85) translate(-12, -12)" fill="none" stroke="#00ff66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Monitor Frame -->
      <path d="M6.5 6h11A1.5 1.5 0 0 1 19 7.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 13.5v-6A1.5 1.5 0 0 1 6.5 6z" />
      <!-- Terminal Prompt > -->
      <path d="M8 9l2 1.5-2 1.5" />
      <!-- Terminal Cursor _ -->
      <path d="M11.5 12.5h2.5" />
      <!-- Breach Crack -->
      <path d="M16.5 6l-1 1.8 1.4.9-.9 1.6" />
      <!-- Stand & Pedestal -->
      <path d="M12 15v2.5" />
      <path d="M9.5 18h5" />
    </g>

    <!-- Launch Arrow (Rotated Upward: -90 deg) -->
    <g transform="translate(12, 12) rotate(-90) translate(-12, -12)">
      <path d="M18.8 8.8H23.8L28 12L23.7 15.2H18.8L21.7 12Z" 
            fill="#00ff66" 
            fill-opacity="0.35" 
            stroke="#00ff66" 
            stroke-width="1.6" 
            stroke-linejoin="round" />
    </g>
  </g>
</svg>
