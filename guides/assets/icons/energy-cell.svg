<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Zero-Day Protocol: Energy Block / Auxiliary Core (B) -->
  <defs>
    <filter id="energy-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Core Diamond Frame -->
  <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" 
        fill="#1a1400" 
        stroke="#ffcc00" 
        stroke-width="1.6" 
        filter="url(#energy-glow)" />

  <!-- High-Voltage Energy Bolt -->
  <path d="M13 2.5L6.5 13H12L11 21.5L17.5 11H12L13 2.5Z" 
        fill="#ffcc00" 
        stroke="#fff" 
        stroke-width="0.6" 
        stroke-linejoin="round" 
        filter="url(#energy-glow)" />
</svg>
