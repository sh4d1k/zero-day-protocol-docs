<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Zero-Day Protocol: Target Server (Exit E) -->
  <defs>
    <filter id="server-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rack Chassis -->
  <g fill="none" 
     stroke="#38bdf8" 
     stroke-width="1.6" 
     stroke-linecap="round" 
     stroke-linejoin="round"
     filter="url(#server-glow)">
    <!-- Unit 1 -->
    <path d="M5 3h14a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
    <!-- Unit 2 -->
    <path d="M5 9.5h14a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z" />
    <!-- Unit 3 -->
    <path d="M5 16h14a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z" />
    <!-- Drive Slots -->
    <path d="M10 5.5h7" stroke-width="1.2" />
    <path d="M10 18.5h7" stroke-width="1.2" />
  </g>

  <!-- Status LEDs -->
  <circle cx="7" cy="5.5" r="0.8" fill="#00ff66" />
  <circle cx="7" cy="12" r="0.8" fill="#00f3ff" />
  <circle cx="7" cy="18.5" r="0.8" fill="#00ff66" />

  <!-- Data Core Loot -->
  <polygon points="15.5,10.1 17.2,11.1 17.2,13 15.5,14 13.8,13 13.8,11.1" fill="#ffffff" stroke="#38bdf8" stroke-width="0.8" />
</svg>
