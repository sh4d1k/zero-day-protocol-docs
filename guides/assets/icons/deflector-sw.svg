<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Zero-Day Protocol: Deflector SW (South to West ╗) -->
  <defs>
    <filter id="deflector-glow-sw" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ╗ Deflector Double Routing Rail (South to West) -->
  <g fill="none" 
     stroke="#00f3ff" 
     stroke-width="1.8" 
     stroke-linecap="round" 
     stroke-linejoin="round"
     filter="url(#deflector-glow-sw)">
    <!-- Inner Rail -->
    <path d="M2 9.5H14.5V22" />
    <!-- Outer Rail -->
    <path d="M2 14.5H9.5V22" />
  </g>
</svg>
