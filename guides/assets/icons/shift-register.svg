<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Zero-Day Protocol: Shift Register (East ⇉) -->
  <defs>
    <filter id="shift-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Two Parallel Right-Pointing Arrows (⇉) -->
  <g fill="none" 
     stroke="#00f3ff" 
     stroke-width="1.8" 
     stroke-linecap="round" 
     stroke-linejoin="round"
     filter="url(#shift-glow)">
    <!-- Top Arrow: Shaft & Arrowhead -->
    <path d="M4 8.5h14" />
    <path d="M15 5.5l3 3-3 3" />
    <!-- Bottom Arrow: Shaft & Arrowhead -->
    <path d="M4 15.5h14" />
    <path d="M15 12.5l3 3-3 3" />
  </g>
</svg>
